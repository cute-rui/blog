[package]
name = "md2wx-android"
version = "0.1.0"
edition = "2021"
description = "UniFFI bindings for the md2wx render function. No IO and no network."
license = "ISC"
publish = false

[lib]
name = "md2wx_android"
crate-type = ["lib", "cdylib"]

[features]
cli = ["uniffi/cli"]

[dependencies]
md2wx = { path = ".." }
uniffi = { version = "=0.29.5", default-features = false }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]
