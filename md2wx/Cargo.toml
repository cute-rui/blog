[package]
name = "md2wx"
version = "0.1.0"
edition = "2021"
description = "Render a CommonMark and GFM subset to WeChat inline HTML."
license = "ISC"
publish = false
readme = "README.md"

[dependencies]
pulldown-cmark = "=0.12.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "=5.2.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
