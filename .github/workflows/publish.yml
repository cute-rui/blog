# 博客仓库的发布 workflow。默认 WECHAT_MODE=html：构建网站和公众号复制页。
# 不调用微信接口，没有草稿箱 job，没有 Tailscale，也不写 publish-state。
# 内容仓库把 templates/blog-content/.github/workflows/notify.yml 复制到自己的 .github/workflows/ 后，
# 用 GitHub App 安装令牌发 repository_dispatch。

name: Publish

on:
  repository_dispatch:
    types: [content-push]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: blog、wechat 或 both。复制页始终随网站生成。
        type: choice
        options:
          - both
          - blog
          - wechat
        default: both
      slugs:
        description: 可选，逗号分隔的文章 slug，只用于 summary 里标出本次关注的文章。
        required: false
        type: string

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WECHAT_MODE: ${{ vars.WECHAT_MODE || 'html' }}
      WX_PAGE_KEY: ${{ secrets.WX_PAGE_KEY }}
    steps:
      - name: Checkout blog
        uses: actions/checkout@v4

      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_KEY }}
          repositories: blog-content

      - name: Checkout content
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/blog-content
          token: ${{ steps.app.outputs.token }}
          path: content
          ref: ${{ github.event.client_payload.after || 'main' }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build md2wx
        run: pnpm md2wx:build

      - name: Lint content
        run: pnpm lint:content

      - name: Apply Publish-To
        run: node scripts/prepare-publish.mjs
        env:
          CONTENT_BEFORE: ${{ github.event.client_payload.before }}
          CONTENT_AFTER: ${{ github.event.client_payload.after }}
          DISPATCH_TARGETS: ${{ github.event_name == 'workflow_dispatch' && inputs.targets || '' }}
          DISPATCH_SLUGS: ${{ github.event_name == 'workflow_dispatch' && inputs.slugs || '' }}

      - name: Build site and copy pages
        run: |
          mkdir -p content/posts
          pnpm exec astro build

      - name: Workflow summary
        run: node scripts/write-summary.mjs

      - name: Upload wechat-html artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-html
          path: dist/wx
          if-no-files-found: error

      - name: Check Cloudflare token
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Cloudflare Pages"
              echo ""
              echo "跳过 \`wrangler pages deploy\`：仓库密钥 \`CLOUDFLARE_API_TOKEN\` 不存在。"
              echo "站点已经构建在 \`dist/\`，这一次没有部署。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stage deploy directory
        if: steps.cloudflare.outputs.present == 'true'
        run: |
          rm -rf deploy-dist
          cp -a dist deploy-dist
          rm -f deploy-dist/wx/index.json
          {
            echo "### Cloudflare Pages"
            echo ""
            echo "部署目录去掉了可猜路径 \`/wx/index.json\`。App 使用 summary 里的清单地址。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy deploy-dist --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT || 'blog' }}" --commit-dirty=true
