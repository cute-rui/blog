# 博客仓库的发布 workflow。构建网站和公众号复制页，并从公开内容仓库同步尚未入草稿箱、也未发布的公众号文章。
# 微信接口只由固定 IP 上的 wechat-egress 调用。本 workflow 不请求微信，不群发，也不发表。
# AppID 和 AppSecret 留在 VPS 的 TOML 里。内容仓库的 notify.yml 仍用 GitHub App 安装令牌发 repository_dispatch。

name: Publish

on:
  repository_dispatch:
    types: [content-push]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: blog、wechat 或 both。复制页始终随网站生成。
        type: choice
        options:
          - both
          - blog
          - wechat
        default: both
      slugs:
        description: 可选，逗号分隔的文章 slug，只用于 summary 里标出本次关注的文章。
        required: false
        type: string

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WECHAT_MODE: ${{ vars.WECHAT_MODE || 'html' }}
      WX_PAGE_KEY: ${{ secrets.WX_PAGE_KEY }}
    steps:
      - name: Checkout blog
        uses: actions/checkout@v4

      - name: Checkout content
        uses: actions/checkout@v4
        with:
          repository: cute-rui/blog-source
          path: content
          ref: ${{ github.event.client_payload.after || 'main' }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version-file: wechat-egress/go.mod
          cache-dependency-path: wechat-egress/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build md2wx
        run: pnpm md2wx:build

      - name: Lint content
        run: pnpm lint:content

      - name: Apply Publish-To
        run: node scripts/prepare-publish.mjs
        env:
          CONTENT_BEFORE: ${{ github.event.client_payload.before }}
          CONTENT_AFTER: ${{ github.event.client_payload.after }}
          DISPATCH_TARGETS: ${{ github.event_name == 'workflow_dispatch' && inputs.targets || '' }}
          DISPATCH_SLUGS: ${{ github.event_name == 'workflow_dispatch' && inputs.slugs || '' }}

      - name: Build site and copy pages
        run: |
          mkdir -p content/posts
          pnpm exec astro build

      - name: Workflow summary
        run: node scripts/write-summary.mjs

      - name: Upload wechat-html artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-html
          path: dist/wx
          if-no-files-found: error

      - name: Check Cloudflare token
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Cloudflare Pages"
              echo ""
              echo "跳过 \`wrangler pages deploy\`：仓库密钥 \`CLOUDFLARE_API_TOKEN\` 不存在。"
              echo "站点已经构建在 \`dist/\`，这一次没有部署。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stage deploy directory
        if: steps.cloudflare.outputs.present == 'true'
        run: |
          rm -rf deploy-dist
          cp -a dist deploy-dist
          rm -f deploy-dist/wx/index.json
          {
            echo "### Cloudflare Pages"
            echo ""
            echo "部署目录去掉了可猜路径 \`/wx/index.json\`。App 使用 summary 里的清单地址。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy deploy-dist --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT || 'blog' }}" --commit-dirty=true

      - name: Sync missing WeChat drafts
        id: wechat
        continue-on-error: true
        working-directory: wechat-egress
        env:
          WECHAT_EGRESS_TOKEN: ${{ secrets.WECHAT_EGRESS_TOKEN }}
          WECHAT_EGRESS_SRV_HOST: ${{ vars.WECHAT_EGRESS_SRV_HOST }}
          WECHAT_EGRESS_TLS_SERVER_NAME: ${{ vars.WECHAT_EGRESS_TLS_SERVER_NAME }}
          WECHAT_EGRESS_TLS_CA_PEM: ${{ secrets.WECHAT_EGRESS_TLS_CA }}
        run: |
          set -euo pipefail
          if [ -n "${WECHAT_EGRESS_TLS_CA_PEM}" ]; then
            printf '%s\n' "$WECHAT_EGRESS_TLS_CA_PEM" > "$RUNNER_TEMP/wechat-egress-ca.pem"
            export WECHAT_EGRESS_TLS_CA="$RUNNER_TEMP/wechat-egress-ca.pem"
          fi
          unset WECHAT_EGRESS_TLS_CA_PEM
          go build -o "$RUNNER_TEMP/wechat-egress" ./cmd/wechat-egress
          WECHAT_EGRESS_BIN="$RUNNER_TEMP/wechat-egress" node ../scripts/sync-wechat-drafts.mjs

      - name: Report WeChat sync failure
        if: steps.wechat.outcome == 'failure'
        run: exit 1
