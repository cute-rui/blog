<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>公众号粘贴实测样本</title>
  <style>
    body { margin: 24px; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #1b2430; background: #e6edf4; }
    .hint { max-width: 677px; margin: 0 auto 16px; font-size: 14px; line-height: 1.6; }
    .frame { max-width: 677px; margin: 0 auto; background: #fff; border: 1px dashed #2a5a86; padding: 8px; }
  </style>
</head>
<body>
  <p class="hint">用浏览器打开本文件。只选中虚线框里的正文，复制，分别粘贴到电脑上的公众号后台和手机「公众号助手」。看内联样式、代码块空格和这张 https 图片会不会留下来。虚线框外面的说明不要一起复制。</p>
  <div class="frame">
    <section style="font-size:16px;line-height:1.75;color:#1b2430;">
      <p style="margin:0 0 16px;font-size:16px;line-height:1.75;color:#1b2430;">这是一份手工写的粘贴样本，样式都在标签上。</p>
      <p style="margin:0 0 16px;font-size:16px;line-height:1.75;color:#1b2430;">下面是一张外部图片，地址是 https。</p>
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/PNG_transparency_demonstration_1.png/280px-PNG_transparency_demonstration_1.png" alt="一张用于粘贴测试的彩色方块" style="max-width:100%;height:auto;display:block;margin:0 auto 16px;" />
      <section style="overflow-x:auto;margin:0 0 16px;background:#f2f6fa;border:1px solid #c5d1de;border-radius:6px;">
        <pre style="margin:0;padding:12px 14px;"><code style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;"><span style="display:block;color:#1b2430;">fn main() {</span><span style="display:block;color:#1b2430;">&nbsp;&nbsp;println!(&quot;保持缩进&quot;);</span><span style="display:block;color:#1b2430;">}</span></code></pre>
      </section>
    </section>
  </div>
</body>
</html>
